seasons: ["2016/17", "2017/18", "2018/19", "2019/20", "2020/21", "2021/22", "2022/23", "2023/24", "2024/25", "2025/26"]
train_window: 3
paths:
  stats: data/stats
  player_lists: data/player_lists
  output: output
time_decay: {base: 1.5}
reliability: {reference_pv: 30, function: sqrt, exclude_left_mid_season: true}
history: {historical_min_pv_total: 15}
performance: {min_pv_for_percentile: 1}
bonus_profile:
  min_pv_for_percentile: 1
  goal_rate_metric: GoalRate
  # Calibrated in the first Phase 1 run: maximum observed zero block was 69.8%
  # (defender AssistRate, 2017/18).  This remains a warning threshold.
  max_zero_share: 0.70
  max_clipped_share: 0.05
  zero_handling: {D: recenter, C: recenter, A: recenter}
  roles:
    D: {weight_in_rating: 0.15, goal_weight: 0.60, assist_weight: 0.40}
    C: {weight_in_rating: 0.15, goal_weight: 0.60, assist_weight: 0.40}
    A: {weight_in_rating: 0.15, goal_weight: 0.70, assist_weight: 0.30}
rating:
  # Phase 4 selection recalibration: 0.85/0.15 passes the P precision guardrail;
  # the previous 0.75/0.25 failed it in three of six folds.
  P: {performance: 0.85, reliability: 0.15, bonus: 0.00}
  D: {performance: 0.60, reliability: 0.25, bonus: 0.15}
  C: {performance: 0.60, reliability: 0.25, bonus: 0.15}
  A: {performance: 0.60, reliability: 0.25, bonus: 0.15}
goalkeeping: {fm_weight: 0.75, goals_conceded_weight: 0.20, penalty_save_weight: 0.05}
confidence:
  season_coverage_weight: 0.40
  availability_weight: 0.40
  stability_weight: 0.20
  sd_reference: 0.20
  threshold_alta: 0.75
  threshold_media: 0.50
trend: {min_seasons: 2, strong_up: 0.20, up: 0.08, down: -0.08, strong_down: -0.20}
validation:
  train_window_grid: [2, 3, 4, 5]
  time_decay_grid: [1.3, 1.5, 2.0, 2.5]
  reference_pv_grid: [25, 30, 34]
  precision_n: {P: [5, 10], D: [10, 20, 30], C: [10, 20, 30], A: [10, 20, 30]}
  precision_degradation_tolerance: 0.05
  qti_bands: 4
risk_flags: {penalty_dependency_threshold: 0.40, volatility_threshold: 0.40, low_recent_pv_threshold: 10}
