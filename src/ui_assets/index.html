<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantastat — Asta offline</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><h1>Fantastat</h1><label>Stagione <select id="season"></select></label></header>
  <main>
    <section class="catalogue"><div class="filters">
      <input id="search" placeholder="Cerca un giocatore" autocomplete="off">
      <select id="role"><option value="">Tutti i ruoli</option><option>P</option><option>D</option><option>C</option><option>A</option></select>
      <select id="club"><option value="">Tutte le squadre</option></select>
      <select id="tier"><option value="">Tutte le fasce</option><option value="__missing__">Senza guida</option></select>
    </div><p id="count"></p><div class="table-wrap"><table><thead><tr>
      <th data-key="name">Nome</th><th data-key="role">R</th><th data-key="club">Squadra</th><th data-key="quotation">Qt.</th><th data-key="fvm">FVM</th><th data-key="rank">Rank</th><th data-key="predicted_appearances">Pres.</th><th data-key="predicted_fantasy_average">FM</th><th data-key="expected_points">Pt.</th><th data-key="tier">Fascia</th>
    </tr></thead><tbody id="players"></tbody></table></div></section>
    <aside id="detail"><p>Seleziona un giocatore per vedere le evidenze dell'asta.</p></aside>
  </main><script src="/app.js"></script>
</body></html>
