<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantastat — Asta offline</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><h1>Fantastat</h1><div class="season-controls"><label>Stagione <select id="season"></select></label><a id="guide" class="button" href="/guide.html">Documenti</a></div></header>
  <main>
    <section class="catalogue"><div class="filters">
      <input id="search" placeholder="Cerca un giocatore" autocomplete="off">
      <select id="role"><option value="">Tutti i ruoli</option><option>P</option><option>D</option><option>C</option><option>A</option></select>
      <select id="club"><option value="">Tutte le squadre</option></select>
      <select id="fascia"><option value="">Tutte le fasce</option><option value="__missing__">Senza guida</option></select>
    </div><p id="count"></p><div class="table-wrap"><table><thead><tr>
      <th data-key="name" data-tooltip="Nome del giocatore" tabindex="0">Nome</th><th data-key="role" data-tooltip="Ruolo del giocatore" tabindex="0">R</th><th data-key="club" data-tooltip="Squadra di appartenenza" tabindex="0">Squadra</th><th data-key="quotation" data-tooltip="Quotazione attuale" tabindex="0">Qt.</th><th data-key="fvm" data-tooltip="Fantavalore medio" tabindex="0">FVM</th><th data-key="expected_points" data-tooltip="Punti attesi" tabindex="0">Pt.</th><th data-key="predicted_appearances" data-tooltip="Presenze previste" tabindex="0">Pres.</th><th data-key="predicted_fantasy_average" data-tooltip="Fantamedia prevista" tabindex="0">FM</th><th data-key="tier" data-tooltip="Fascia nella guida d'asta unificata" tabindex="0">Fascia</th>
    </tr></thead><tbody id="players"></tbody></table></div></section>
    <aside id="detail"><p>Seleziona un giocatore per vedere le evidenze dell'asta.</p></aside>
  </main><script src="/app.js"></script>
</body></html>
